<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>떡치기</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafaf7;
    font-family: system-ui, "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  #count { position: fixed; top: 6vh; left: 0; right: 0; text-align: center;
    font-size: clamp(48px, 10vw, 96px); font-weight: 800; color: #2b2622;
    pointer-events: none; transition: transform .08s ease-out; }
  #count.pop { transform: scale(1.15); transition: none; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="count">0</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 4.5, 8);
camera.lookAt(0, 0.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// 조명
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d0c4, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(3, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
scene.add(sun);

// 바닥은 안 보이고 그림자만
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 떡
const BASE_XZ = 1.4, BASE_Y = 0.62;
const ddeok = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 32),
  new THREE.MeshStandardMaterial({ color: 0xf6f1e7, roughness: 0.85 })
);
ddeok.castShadow = true;
scene.add(ddeok);

// 떡메 (평소엔 화면 위로 숨어 있음)
const wood = new THREE.MeshStandardMaterial({ color: 0xa8733f, roughness: 0.7 });
const mallet = new THREE.Group();
const head = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.8, 32), wood);
head.rotation.z = Math.PI / 2;
head.castShadow = true;
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3, 16), wood);
handle.position.y = 1.9;
handle.castShadow = true;
mallet.add(head, handle);
scene.add(mallet);

const REST_Y = 12; // 어느 각도에서 봐도 화면 밖
const CONTACT_Y = BASE_Y * 2 * (1 - 0.4) + 0.5; // 눌린 떡 윗면 + 떡메 반지름
mallet.position.y = REST_Y;

let mode = 'up', pending = 0;
let squash = 0, squashV = 0;
let count = 0;
const countEl = document.getElementById('count');

function impact() {
  squash = 0.4; squashV = 0;
  count++;
  countEl.textContent = count;
  countEl.classList.add('pop');
  requestAnimationFrame(() => countEl.classList.remove('pop'));
}

// 떡을 눌렀을 때만 친다
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitsDdeok(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(ddeok).length > 0;
}
// 휠클릭 드래그로 화면 돌리기
const TARGET = new THREE.Vector3(0, 0.3, 0);
const RADIUS = Math.hypot(4.2, 8);
let azim = 0, elev = Math.atan2(4.2, 8);
let orbiting = false, lastX = 0, lastY = 0;
function placeCamera() {
  camera.position.set(
    TARGET.x + RADIUS * Math.cos(elev) * Math.sin(azim),
    TARGET.y + RADIUS * Math.sin(elev),
    TARGET.z + RADIUS * Math.cos(elev) * Math.cos(azim)
  );
  camera.lookAt(TARGET);
}
placeCamera();

const canvas = renderer.domElement;
canvas.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); }); // 자동 스크롤 막기
canvas.addEventListener('pointerdown', e => {
  if (e.button === 1) {
    orbiting = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0 || !hitsDdeok(e)) return;
  pending++;
  mode = 'down';
});
canvas.addEventListener('pointermove', e => {
  if (orbiting) {
    azim -= (e.clientX - lastX) * 0.008;
    elev = Math.min(1.0, Math.max(0.05, elev + (e.clientY - lastY) * 0.006));
    lastX = e.clientX; lastY = e.clientY;
    placeCamera();
    return;
  }
  canvas.style.cursor = hitsDdeok(e) ? 'pointer' : 'default';
});
canvas.addEventListener('pointerup', e => {
  if (e.button !== 1) return;
  orbiting = false;
  canvas.style.cursor = 'default';
});

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (mode === 'down') {
    mallet.position.y -= 100 * dt;
    if (mallet.position.y <= CONTACT_Y) {
      mallet.position.y = CONTACT_Y;
      impact();
      pending--;
      mode = 'up';
    }
  } else {
    mallet.position.y += (REST_Y - mallet.position.y) * Math.min(1, dt * 10);
    // 연타가 밀려 있으면 조금만 올라갔다가 다시 내려친다
    if (pending > 0 && mallet.position.y > CONTACT_Y + 1.2) mode = 'down';
  }
  mallet.rotation.z = (mallet.position.y - CONTACT_Y) * 0.03;

  // 떡이 눌렸다가 말랑하게 돌아옴
  squashV += (-squash * 300 - squashV * 14) * dt;
  squash += squashV * dt;
  const sy = BASE_Y * (1 - squash), sxz = BASE_XZ * (1 + squash * 0.5);
  ddeok.scale.set(sxz, sy, sxz);
  ddeok.position.y = sy;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
