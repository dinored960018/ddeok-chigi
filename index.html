<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2인 떡치기</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9a9a9;
    font-family: system-ui, "Malgun Gothic", sans-serif; color: #2b2622;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 4vh; left: 0; right: 0; text-align: center; pointer-events: none; }
  #combo { font-size: clamp(48px, 10vw, 96px); font-weight: 800; line-height: 1; transition: transform .08s ease-out; }
  #combo.pop { transform: scale(1.15); transition: none; }
  #comboLabel { font-size: 14px; font-weight: 700; letter-spacing: .1em; margin-top: 4px; }
  #bar { width: min(60vw, 480px); height: 14px; margin: 12px auto 0; border-radius: 7px;
    background: rgba(0,0,0,.18); overflow: hidden; }
  #fill { height: 100%; width: 100%; border-radius: 7px; background: #4caf50; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; pointer-events: none; text-align: center; padding: 0 16px; }
  #big { font-size: clamp(36px, 8vw, 80px); font-weight: 900; text-shadow: 0 2px 0 rgba(255,255,255,.5); }
  #sub { font-size: clamp(16px, 3vw, 22px); font-weight: 700; margin-top: 10px; white-space: pre-line; }
  #card { padding: 20px 28px; border-radius: 18px; background: rgba(255,255,255,.8); }
  #card:has(#big:empty) { display: none; }
  #solo { position: fixed; top: 12px; right: 14px; font-size: 13px; color: #2b2622; }
  body.shake canvas { animation: shake .35s; }
  @keyframes shake { 20% { transform: translate(-8px, 4px) } 40% { transform: translate(7px, -5px) }
    60% { transform: translate(-5px, -3px) } 80% { transform: translate(4px, 3px) } }
</style>
</head>
<body>
<div id="hud">
  <div id="combo">0</div>
  <div id="comboLabel">COMBO</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<div id="msg"><div id="card"><div id="big">2인 떡치기</div><div id="sub">1P 떡메: A 키 · 왼쪽 터치
2P 손: L 키 · 오른쪽 터치

떡메와 손이 번갈아 치기
같은 쪽이 두 번 치거나 게이지가 다 닳으면 그 사람이 패배

아무 키나 눌러 시작</div></div></div>
<a id="solo" href="solo.html">혼자 치기</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// 조명
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d0c4, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(3, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 25 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.25 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 절구
const mortarProfile = [[0, 0], [1.7, 0], [1.95, 1.4], [1.62, 1.4], [1.3, 0.9], [0, 0.9]]
  .map(([x, y]) => new THREE.Vector2(x, y));
const mortar = new THREE.Mesh(new THREE.LatheGeometry(mortarProfile, 48),
  new THREE.MeshStandardMaterial({ color: 0x6b3f1f, roughness: 0.8, side: THREE.DoubleSide }));
mortar.castShadow = true;
mortar.receiveShadow = true;
scene.add(mortar);

// 떡
const DDEOK_BASE = 0.9, DDEOK_XZ = 1.25, DDEOK_Y = 0.55;
const ddeok = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32),
  new THREE.MeshStandardMaterial({ color: 0xf6f1e7, roughness: 0.85 }));
ddeok.castShadow = true;
ddeok.receiveShadow = true;
scene.add(ddeok);

// 떡메 (왼쪽)
const wood = new THREE.MeshStandardMaterial({ color: 0x8a5a2e, roughness: 0.7 });
const mallet = new THREE.Group();
const head = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.6, 32), wood);
head.rotation.z = Math.PI / 2;
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3, 16), wood);
handle.position.y = 1.9;
head.castShadow = handle.castShadow = true;
mallet.add(head, handle);
scene.add(mallet);

// 손 (오른쪽)
const skinColor = new THREE.Color(0xf1c7a5), hurtColor = new THREE.Color(0xe0574a);
const skin = new THREE.MeshStandardMaterial({ color: skinColor.clone(), roughness: 0.6 });
const hand = new THREE.Group();
const palm = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), skin);
palm.scale.set(0.55, 0.16, 0.42);
hand.add(palm);
[-0.27, -0.09, 0.09, 0.27].forEach(z => {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.55, 12), skin);
  f.rotation.z = Math.PI / 2;
  f.position.set(-0.7, 0, z);
  hand.add(f);
});
const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.4, 12), skin);
thumb.rotation.x = Math.PI / 2;
thumb.position.set(-0.15, 0, 0.55);
hand.add(thumb);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 3, 16),
  new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 0.8 }));
arm.rotation.z = Math.PI / 2 + 0.15;
arm.position.set(1.95, 0.2, 0);
hand.add(arm);
hand.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(hand);

const MALLET_UP = { x: -2.3, y: 4.1, rz: 0.6 }, MALLET_DOWN = { x: -0.1, y: 2.07, rz: 0 };
const HAND_UP = { x: 3.0, y: 2.7, rz: -0.2 }, HAND_DOWN = { x: 0.55, y: 2.12, rz: 0 };
const lerp = (a, b, t) => a + (b - a) * t;
function pose(obj, A, B, m) {
  obj.position.set(lerp(A.x, B.x, m), lerp(A.y, B.y, m), 0);
  obj.rotation.z = lerp(A.rz, B.rz, m);
}

// 내려쳤다 올라오는 동작 (m: 0 = 대기, 1 = 닿음)
function makeSwing(down, up, onContact) {
  return { t: 99, from: 0, m: 0, hold: false, down, up, onContact, hit: true,
    start() { this.from = this.m; this.t = 0; this.hit = false; } };
}
function stepSwing(s, dt) {
  s.t += dt;
  if (s.t < s.down) s.m = lerp(s.from, 1, (s.t / s.down) ** 2);
  else {
    if (!s.hit) { s.hit = true; s.onContact(); }
    if (s.hold) s.m = 1;
    else { const u = Math.min(1, (s.t - s.down) / s.up); s.m = 1 - u * (2 - u); }
  }
}
let squash = 0, squashV = 0, spin = 0, spinV = 0;
const malletSwing = makeSwing(0.06, 0.14, () => { squash = 0.35; squashV = 0; thud(140, 0.15, 0.6); });
const handSwing = makeSwing(0.07, 0.15, () => { spinV += 6; squash = Math.max(squash, 0.1); thud(520, 0.05, 0.25); });

// 휠클릭 드래그로 화면 돌리기
const TARGET = new THREE.Vector3(0, 1.8, 0);
const RADIUS = Math.hypot(4.5, 9.5);
let azim = 0, elev = Math.atan2(4.5, 9.5);
let orbiting = false, lastX = 0, lastY = 0;
function placeCamera() {
  camera.position.set(
    TARGET.x + RADIUS * Math.cos(elev) * Math.sin(azim),
    TARGET.y + RADIUS * Math.sin(elev),
    TARGET.z + RADIUS * Math.cos(elev) * Math.cos(azim)
  );
  camera.lookAt(TARGET);
}
placeCamera();

// 효과음
let ac = null;
function thud(freq, dur, vol) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.4, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur);
}

// 게임 상태
const P = [{ who: '1P', name: '떡메' }, { who: '2P', name: '손' }];
const $ = id => document.getElementById(id);
let state = 'ready', combo = 0, gauge = 1, turn = 0, overAt = 0, best = 0;
try { best = +localStorage.getItem('ddeok2p-best') || 0; } catch (e) {}

function drainRate() { return Math.min(2.2, 0.35 + combo * 0.012); } // 콤보가 오를수록 빨리 닳음

function show(big, sub) { $('big').textContent = big; $('sub').textContent = sub || ''; }
function updateHud() {
  $('combo').textContent = combo;
}

function startCountdown() {
  state = 'count'; combo = 0; gauge = 1; turn = 0;
  handSwing.hold = false; skin.color.copy(skinColor); hand.scale.set(1, 1, 1);
  updateHud();
  let n = 3;
  show(n);
  const iv = setInterval(() => {
    n--;
    if (n > 0) { show(n); return; }
    clearInterval(iv);
    state = 'play'; updateHud();
    show('시작!', '1P 떡메부터');
    setTimeout(() => { if (state === 'play') show(''); }, 600);
  }, 600);
}

function lose(p, reason) {
  state = 'over'; overAt = performance.now();
  if (combo > best) { best = combo; try { localStorage.setItem('ddeok2p-best', best); } catch (e) {} }
  updateHud();
  const w = P[1 - p];
  show(`${w.who} ${w.name} 승리!`, `${reason}\n콤보 ${combo} · 최고 ${best}\n\n아무 키나 눌러 다시`);
  thud(90, 0.5, 0.7);
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
}

function act(p) {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (state === 'ready' || (state === 'over' && performance.now() - overAt > 800)) { startCountdown(); return; }
  if (state !== 'play') return;

  if (p === 0) malletSwing.start(); else handSwing.start();

  if (p !== turn) {
    if (p === 0) { // 떡메가 두 번 치면 손을 내리찍음
      handSwing.start(); handSwing.hold = true;
      skin.color.copy(hurtColor); hand.scale.set(1, 0.6, 1);
    }
    lose(p, `${P[p].who} ${P[p].name} 두 번 연속!`);
    return;
  }
  combo++;
  gauge = Math.min(1, gauge + 0.15);
  turn = 1 - turn;
  updateHud();
  $('combo').classList.add('pop');
  requestAnimationFrame(() => $('combo').classList.remove('pop'));
}

// 입력
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyA') act(0);
  else if (e.code === 'KeyL') act(1);
  else if (state === 'ready' || state === 'over') act(-1);
});
const canvas = renderer.domElement;
canvas.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); }); // 자동 스크롤 막기
canvas.addEventListener('pointerdown', e => {
  if (e.button === 1) {
    orbiting = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    return;
  }
  if (e.button !== 0) return;
  act(e.clientX < innerWidth / 2 ? 0 : 1);
});
canvas.addEventListener('pointermove', e => {
  if (!orbiting) return;
  azim -= (e.clientX - lastX) * 0.008;
  elev = Math.min(1.0, Math.max(0.05, elev + (e.clientY - lastY) * 0.006));
  lastX = e.clientX; lastY = e.clientY;
  placeCamera();
});
canvas.addEventListener('pointerup', e => {
  if (e.button !== 1) return;
  orbiting = false;
  canvas.style.cursor = 'default';
});

const fill = $('fill');
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state === 'play') {
    gauge -= drainRate() * dt;
    if (gauge <= 0) { gauge = 0; lose(turn, `${P[turn].who} ${P[turn].name} 콤보 끊김!`); }
  }
  fill.style.width = (gauge * 100) + '%';
  fill.style.background = gauge > 0.5 ? '#4caf50' : gauge > 0.25 ? '#f2b33d' : '#e0574a';

  stepSwing(malletSwing, dt);
  stepSwing(handSwing, dt);
  pose(mallet, MALLET_UP, MALLET_DOWN, malletSwing.m);
  pose(hand, HAND_UP, HAND_DOWN, handSwing.m);

  // 떡: 눌렸다 돌아오고, 손으로 뒤집으면 빙글
  squashV += (-squash * 300 - squashV * 14) * dt;
  squash += squashV * dt;
  spinV *= Math.exp(-4 * dt);
  spin += spinV * dt;
  const sy = DDEOK_Y * (1 - squash), sxz = DDEOK_XZ * (1 + squash * 0.5);
  ddeok.scale.set(sxz, sy, sxz);
  ddeok.position.y = DDEOK_BASE + sy;
  ddeok.rotation.y = spin;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
